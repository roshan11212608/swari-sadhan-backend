# ==========================================
# Swari Sewa Backend — Base Configuration
# ==========================================
# This file contains shared/common config that applies to ALL profiles.
# Environment-specific values use ${ENV_VAR:default} syntax so that:
#   - Local dev: works out-of-the-box with the built-in defaults
#   - Production: env vars injected by the deployment platform override defaults
#
# Profile selection:
#   - Default (local dev):  spring.profiles.active=dev (set below)
#   - Production (Docker):  SPRING_PROFILES_ACTIVE=prod (set in entrypoint.sh)
#
# To override any value locally without editing this file, create:
#   src/main/resources/application-dev.properties  (gitignored)
# or set the corresponding environment variable.

spring.application.name=swari-sewa-backend

# Default profile — local development. Overridden to "prod" in Docker.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
# Default to 5000 (AWS Elastic Beanstalk Java SE nginx proxy port).
# Local dev can override via PORT env var or application-dev.properties.
server.port=${PORT:5000}

# Database Configuration (MySQL)
# Local dev defaults to localhost; production uses DB_URL or DB_HOST/DB_PORT/DB_NAME
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swarisadhan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# Dev: update (auto-create/alter tables). Prod: validate (in application-prod.properties)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:swariSewaSecretKeyForJWTTokenGenerationAndValidation2024}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Flyway Configuration (baseline existing schema, then apply new migrations)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# CORS Configuration
# Dev: localhost frontend. Prod: set CORS_ALLOWED_ORIGINS on deployment platform
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Shop-Id
spring.web.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ------------------------------------------
# Brevo SMTP - Email OTP
# ------------------------------------------
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:b5caab001@smtp-brevo.com}
spring.mail.password=${BREVO_SMTP_KEY:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Brevo verified sender
brevo.sender-email=${BREVO_SENDER_EMAIL:swarisadhan@gmail.com}
brevo.sender-name=${BREVO_SENDER_NAME:Swari Sadhan}

# Brevo REST API (leave empty — email sent via SMTP)
brevo.api-key=${BREVO_API_KEY:}

# SMS sender (disabled/fallback in dev)
brevo.sms-sender=${BREVO_SMS_SENDER:SwariSadhn}

# File Upload Configuration
# Per-image maximums are enforced by ImageValidationService before Cloudflare R2 upload:
#   Vehicle/shop images: 2 MB per image
#   Shop logo/profile images: 1 MB per image
# The multipart request limit is calculated for the largest legitimate bundle
# after file-count limits are enforced:
#   10 vehicle photos (2 MB) + 3 bluebook photos (2 MB) + 3 seller documents (2 MB) = 32 MB
#   plus JSON form-data overhead. 34 MB leaves a small margin.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=34MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Logging Configuration
logging.level.swari.sewa=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_HIBERNATE_BINDER:TRACE}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Application Properties
app.name=Swari Sewa - Vehicle Listing Platform
app.version=1.0.0
app.description=SaaS-based Vehicle Recondition Shop Management System

# Pagination Configuration
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Business reporting timezone
# Database timestamps stay UTC; financial reporting periods (current month,
# current year, dashboard ranges) are computed in this zone so they match what
# the business actually experiences. Must never fall back to the JVM default.
app.reporting.timezone=${APP_REPORTING_TIMEZONE:Asia/Kathmandu}

# Finance module limits
app.finance.export.max-rows=${APP_FINANCE_EXPORT_MAX_ROWS:50000}

# Validation Configuration
spring.mvc.validation.fail-fast=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=analyticsDashboard
spring.cache.time-to-live=60000

# ==========================================
# App Base URLs (for email links, payment redirects, etc.)
# ==========================================
app.frontend-base-url=${APP_FRONTEND_URL:http://localhost:3000}
app.backend-base-url=${APP_BACKEND_URL:http://localhost:8081}

