# ==========================================
# Production Configuration - eSewa Payment Gateway
# ==========================================
# Real credentials must be supplied via environment variables.
# Do NOT commit real production secrets to Git.

esewa.environment=production
esewa.product-code=${ESEWA_PRODUCT_CODE}
esewa.secret-key=${ESEWA_SECRET_KEY}
esewa.payment-url=${ESEWA_PAYMENT_URL}
esewa.status-url=${ESEWA_STATUS_URL}
esewa.backend-success-url=${ESEWA_BACKEND_SUCCESS_URL}
esewa.backend-failure-url=${ESEWA_BACKEND_FAILURE_URL}
esewa.frontend-success-url=${ESEWA_FRONTEND_SUCCESS_URL}
esewa.frontend-failure-url=${ESEWA_FRONTEND_FAILURE_URL}
