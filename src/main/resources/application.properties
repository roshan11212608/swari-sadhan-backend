# Spring Boot Application Configuration
spring.application.name=swari-sewa-backend
spring.profiles.active=dev
 
# Server Configuration
server.port=8081
 
# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/swarisadhan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# JWT Configuration
jwt.secret=${JWT_SECRET:swariSewaSecretKeyForJWTTokenGenerationAndValidation2024}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Flyway Configuration (baseline existing schema, then apply new migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration
 
# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Shop-Id
spring.web.cors.allow-credentials=false
 
# ==========================================
# Swari Sewa - Development Configuration
# ==========================================

# ------------------------------------------
# Brevo SMTP - Email OTP
# ------------------------------------------
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=b5caab001@smtp-brevo.com
spring.mail.password=${BREVO_SMTP_KEY:}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Brevo verified sender
brevo.sender-email=swarisadhan@gmail.com
brevo.sender-name=Swari Sadhan


# ------------------------------------------
# Brevo REST API
# ------------------------------------------
# Leave empty because email is being sent
# through Brevo SMTP.
brevo.api-key=

# SMS sender
# SMS is disabled/fallback in dev because
# Brevo SMS requires paid credits.
brevo.sms-sender=SwariSadhn 
# File Upload Configuration

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
 
# Logging Configuration
logging.level.swari.sewa=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
 
# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
 
# Application Properties
app.name=Swari Sewa - Vehicle Listing Platform
app.version=1.0.0
app.description=SaaS-based Vehicle Recondition Shop Management System
 
# Pagination Configuration
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
 
# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
 
# Validation Configuration
spring.mvc.validation.fail-fast=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=analyticsDashboard
spring.cache.time-to-live=60000
