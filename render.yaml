services:
  - type: web
    name: swari-sadhan-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # All secrets below MUST be configured in the Render Dashboard.
      # Do not commit real values to this file.
      #
      # Database (TiDB Cloud):
      #   DB_URL (or DB_HOST + DB_PORT + DB_NAME)
      #   DB_USERNAME
      #   DB_PASSWORD
      #   DB_SSL_MODE (default: VERIFY_IDENTITY)
      #   TRUSTSTORE_BASE64 (base64-encoded JKS truststore for TiDB SSL)
      #   TRUSTSTORE_PASSWORD
      #
      # JWT:
      #   JWT_SECRET
      #
      # Cloudflare R2:
      #   R2_ENDPOINT
      #   R2_ACCESS_KEY
      #   R2_SECRET_KEY
      #   R2_BUCKET_NAME (default: swari-sadhan-images)
      #   R2_PUBLIC_URL
      #
      # App URLs:
      #   APP_FRONTEND_URL (e.g. https://www.swarisadhan.com)
      #   APP_BACKEND_URL (e.g. https://swari-sadhan-backend.onrender.com)
      #
      # CORS:
      #   CORS_ALLOWED_ORIGINS (e.g. https://www.swarisadhan.com,https://swarisadhan.com)
      #
      # Brevo SMTP:
      #   BREVO_SMTP_KEY
      #   BREVO_SMTP_USERNAME (default: b5caab001@smtp-brevo.com)
      #   BREVO_SENDER_EMAIL (default: swarisadhan@gmail.com)
      #
      # eSewa:
      #   ESEWA_PRODUCT_CODE
      #   ESEWA_SECRET_KEY
      #   ESEWA_PAYMENT_URL
      #   ESEWA_STATUS_URL
      #
      # Fonepay:
      #   FONEPAY_MERCHANT_CODE
      #   FONEPAY_SECRET_KEY
      #   FONEPAY_PAYMENT_URL
