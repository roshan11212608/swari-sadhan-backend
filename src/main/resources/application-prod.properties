# ==========================================
# Production profile overrides for Swari Sewa
# ==========================================
# This file is activated when SPRING_PROFILES_ACTIVE=prod.
# It overrides only the values that differ from the dev defaults
# in application.properties. All real values are supplied through
# environment variables on the deployment platform.
#
# Do NOT commit secrets to this file.

# Database (MySQL / TiDB Cloud MySQL-compatible)
# DB_URL can be a complete JDBC string (recommended for TiDB Cloud).
# If omitted, it is built from DB_HOST/DB_PORT/DB_NAME/DB_SSL_MODE/TRUSTSTORE_*
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&tlsVersions=TLSv1.2&serverTimezone=UTC&trustCertificateKeyStoreUrl=file:${TRUSTSTORE_PATH:/app/truststore.jks}&trustCertificateKeyStorePassword=${TRUSTSTORE_PASSWORD}}

# Production database credentials — NO dev defaults here.
# If DB_USERNAME or DB_PASSWORD is not set, ProductionConfigValidator
# will fail with a clear message. Using : defaults so Spring can resolve
# the placeholder to empty string without crashing bean creation.
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate — validate in production (schema already exists)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway — DISABLED in production.
# The production TiDB database schema was created by Hibernate (on Render).
# A previous Flyway attempt left a failed V3 entry in flyway_schema_history,
# which blocks startup. The schema already exists and is correct.
# Hibernate ddl-auto=validate below verifies schema correctness at startup.
#
# To re-enable Flyway in the future:
#   1. Connect to the production TiDB database
#   2. Delete the failed migration row: DELETE FROM flyway_schema_history WHERE success = 0;
#   3. (Or drop the table entirely: DROP TABLE flyway_schema_history;)
#   4. Set spring.flyway.enabled=true with baseline-on-migrate=true and baseline-version=64
#   5. Redeploy — Flyway will baseline at V64 and only run V65+ migrations
spring.flyway.enabled=false

# CORS — production frontend origins
# If CORS_ALLOWED_ORIGINS is not set, default to the production frontend domains.
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://www.swarisadhan.com,https://swarisadhan.com,https://d1lpyf6fmahap5.cloudfront.net}
spring.web.cors.allow-credentials=true

# JWT — NO default in production. Must be set via JWT_SECRET env var.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Brevo SMTP — NO defaults in production. Must be set via env vars.
spring.mail.username=${BREVO_SMTP_USERNAME:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}

# eSewa — NO defaults in production. Must be set via env vars.
esewa.product-code=${ESEWA_PRODUCT_CODE:}
esewa.secret-key=${ESEWA_SECRET_KEY:}
esewa.payment-url=${ESEWA_PAYMENT_URL:}
esewa.status-url=${ESEWA_STATUS_URL:}

# Fonepay — NO defaults in production. Must be set via env vars.
fonepay.merchant-code-pid=${FONEPAY_MERCHANT_CODE:}
fonepay.merchant-secret-key=${FONEPAY_SECRET_KEY:}
fonepay.payment-url=${FONEPAY_PAYMENT_URL:}

# Logging — less verbose in production
logging.level.swari.sewa=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Actuator — public health check only, no sensitive details
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# TiDB Cloud Serverless free tier can sleep; only keep the basic ping indicator
management.health.defaults.enabled=false
management.health.ping.enabled=true

# Hikari connection pool: keep one connection alive and test it regularly
# so TiDB Cloud Serverless free tier does not sleep as quickly
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=60000

# eSewa production
esewa.environment=production

# Fonepay production
# (all values come from env vars defined in application.properties)
