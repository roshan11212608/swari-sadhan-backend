# Integration test profile — uses a dedicated test database with Flyway enabled
# This ensures all migrations (V43-V52) run, creating real constraints,
# generated columns, unique indexes, and foreign keys.

spring.datasource.url=jdbc:mysql://localhost:3306/swarisadhan_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enable Flyway to create real schema with all constraints
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Let Flyway manage schema, don't let Hibernate modify it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

