services:
  - type: web
    name: swari-sadhan-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database, JWT, payment, email, and R2 credentials must be added
      # in the Render Dashboard. Do not commit secrets to this file.
      # Cloudflare R2 (S3-compatible) object storage:
      #   R2_ENDPOINT
      #   R2_ACCESS_KEY
      #   R2_SECRET_KEY
      #   R2_BUCKET_NAME=swari-sadhan-images
      #   R2_PUBLIC_URL
