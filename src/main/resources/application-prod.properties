# ==========================================
# Production / Render profile for Swari Sewa
# ==========================================
# All real values are supplied through environment variables.
# Do NOT commit secrets to this file or to Git.

# Server
server.port=${PORT:8081}

# Database (MySQL / TiDB Cloud MySQL-compatible)
# DB_URL can be a complete JDBC string (recommended for TiDB Cloud).
# If omitted, it is built from DB_HOST/DB_PORT/DB_NAME/DB_SSL_MODE/TRUSTSTORE_*
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&tlsVersions=TLSv1.2&serverTimezone=UTC&trustCertificateKeyStoreUrl=file:${TRUSTSTORE_PATH:/app/truststore.jks}&trustCertificateKeyStorePassword=${TRUSTSTORE_PASSWORD}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# The schema was already created by the first TiDB deployment.
# Use validate to start faster and avoid accidental schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (must be provided in production)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Flyway
# Disabled for the initial deployment because the project is missing the V1 base schema.
# Flyway files are kept and can be enabled after the initial schema is generated.
spring.flyway.enabled=false

# CORS - Vercel frontend origins
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://www.swarisadhan.com,https://swarisadhan.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Shop-Id
spring.web.cors.allow-credentials=true

# Email (Brevo SMTP)
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Swari Sadhan}
brevo.api-key=${BREVO_API_KEY:}
brevo.sms-sender=${BREVO_SMS_SENDER:SwariSadhn}

# App base URLs
app.frontend-base-url=${APP_FRONTEND_URL}
app.backend-base-url=${APP_BACKEND_URL}

# File upload (local ephemeral storage on Render)
app.upload.dir=${UPLOAD_DIR:uploads}

# Logging
logging.level.swari.sewa=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Actuator (public health check only)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# TiDB Cloud Serverless free tier can sleep; only use the ping health indicator
management.health.db.enabled=false
management.endpoint.health.probes.enabled=false

# Hikari connection pool: keep one connection alive and test it regularly
# so TiDB Cloud Serverless free tier does not sleep as quickly
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=60000

# App metadata
app.name=Swari Sewa - Vehicle Listing Platform
app.version=1.0.0
app.description=SaaS-based Vehicle Recondition Shop Management System
app.reporting.timezone=${APP_REPORTING_TIMEZONE:Asia/Kathmandu}

# Pagination
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Finance
app.finance.export.max-rows=${APP_FINANCE_EXPORT_MAX_ROWS:50000}

# Cache
spring.cache.type=simple
spring.cache.cache-names=analyticsDashboard
spring.cache.time-to-live=60000

# Validation
spring.mvc.validation.fail-fast=true

# eSewa production
esewa.environment=production
esewa.product-code=${ESEWA_PRODUCT_CODE:}
esewa.secret-key=${ESEWA_SECRET_KEY:}
esewa.payment-url=${ESEWA_PAYMENT_URL:}
esewa.status-url=${ESEWA_STATUS_URL:}
esewa.backend-success-url=${APP_BACKEND_URL}/api/payments/esewa/success
esewa.backend-failure-url=${APP_BACKEND_URL}/api/payments/esewa/failure
esewa.frontend-success-url=${APP_FRONTEND_URL}/payment/success
esewa.frontend-failure-url=${APP_FRONTEND_URL}/payment/failure

# Fonepay production
fonepay.merchant-code-pid=${FONEPAY_MERCHANT_CODE:}
fonepay.merchant-secret-key=${FONEPAY_SECRET_KEY:}
fonepay.payment-url=${FONEPAY_PAYMENT_URL:}
fonepay.backend-return-url=${APP_BACKEND_URL}/api/payments/fonepay/verify
fonepay.frontend-success-url=${APP_FRONTEND_URL}/payment/success
fonepay.frontend-failure-url=${APP_FRONTEND_URL}/payment/failure
